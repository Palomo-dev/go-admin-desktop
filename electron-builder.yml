appId: io.goadmin.desktop
productName: Go Admin Desktop
copyright: GO Admin ERP

# Canal de distribución y auto-update (electron-updater lee latest.yml de aquí)
publish:
  - provider: github
    owner: Palomo-dev
    repo: go-admin-desktop

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - src/renderer/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Go Admin Desktop
  installerLanguages: [es_ES]
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/header.bmp
  installerSidebar: build/sidebar.bmp
  # Sin versión en el nombre: la URL releases/latest/download/GoAdminDesktop-Setup.exe
  # siempre apunta a la última versión publicada (no hay que actualizar DOWNLOAD_URL en la web)
  artifactName: GoAdminDesktop-Setup.exe
